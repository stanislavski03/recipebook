services:
  # --- Основная БД (Postgres) ---
  rbk_db:
    image: postgres:16-alpine
    container_name: rbk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RBK_DB_USER}
      POSTGRES_PASSWORD: ${RBK_DB_PASSWORD}
      POSTGRES_DB: ${RBK_DB_NAME}
    volumes:
      - rbk_pgdata:/var/lib/postgresql/data
    networks:
      - rbk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RBK_DB_USER} -d ${RBK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI ---
  rbk_api:
    build:
      context: .
      dockerfile: rbk_api/rbk_Dockerfile.api
    container_name: rbk_api
    restart: unless-stopped
    environment:
      RBK_DB_URL: postgresql+psycopg://${RBK_DB_USER}:${RBK_DB_PASSWORD}@rbk_db:5432/${RBK_DB_NAME}
      RBK_API_HOST: 0.0.0.0
      RBK_API_PORT: 8101
      RBK_DROPBOX_TOKEN: ${RBK_DROPBOX_TOKEN}
    depends_on:
      rbk_db:
        condition: service_healthy
    networks:
      - rbk_net
    links:
      - rbk_db

  # --- Nginx ---
  rbk_nginx:
    build:
      context: .
      dockerfile: rbk_nginx/rbk_Dockerfile.nginx
    container_name: rbk_nginx
    restart: unless-stopped
    ports:
      - "${RBK_NGINX_PORT:-8100}:80"
    depends_on:
      - rbk_api
    networks:
      - rbk_net

  # --- Adminer (просмотр Postgres) ---
  rbk_adminer:
    image: adminer:latest
    container_name: rbk_adminer
    restart: unless-stopped
    ports:
      - "8104:8080"
    environment:
      ADMINER_DEFAULT_SERVER: rbk_db
    depends_on:
      - rbk_db
    networks:
      - rbk_net

  # --- WordPress DB (MySQL) ---
  rbk_wp_db:
    image: mysql:8
    container_name: rbk_wp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rbk_wp_root_pwd
      MYSQL_DATABASE: rbk_wordpress
      MYSQL_USER: rbk_wp_user
      MYSQL_PASSWORD: rbk_wp_pwd
    volumes:
      - rbk_wp_db_data:/var/lib/mysql
    networks:
      - rbk_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prbk_wp_root_pwd"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- WordPress ---
  rbk_wp:
    image: wordpress:6-php8.2-apache
    container_name: rbk_wp
    restart: unless-stopped
    ports:
      - "8102:80"
    environment:
      WORDPRESS_DB_HOST: rbk_wp_db:3306
      WORDPRESS_DB_USER: rbk_wp_user
      WORDPRESS_DB_PASSWORD: rbk_wp_pwd
      WORDPRESS_DB_NAME: rbk_wordpress
      WORDPRESS_TABLE_PREFIX: rbk_wp_
    volumes:
      - rbk_wp_data:/var/www/html
    depends_on:
      rbk_wp_db:
        condition: service_healthy
    networks:
      - rbk_net

volumes:
  rbk_pgdata:
    name: rbk_pgdata
  rbk_wp_db_data:
    name: rbk_wp_db_data
  rbk_wp_data:
    name: rbk_wp_data

networks:
  rbk_net:
    name: rbk_net
    driver: bridge