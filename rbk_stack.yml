# RecipeBook — Swarm stack.
# Запуск: docker stack deploy -c rbk_stack.yml rbk

version: "3.9"

services:

  # --- База данных — только на "узле БД" ---
  rbk_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rbk_user
      POSTGRES_PASSWORD: rbk_password_swarm
      POSTGRES_DB: rbk_db
    volumes:
      - rbk_pgdata_swarm:/var/lib/postgresql/data
    networks:
      - rbk_net_swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.rbk.db == true

  # --- API — 3 реплики на "веб-серверных узлах" ---
  rbk_api:
    image: stanislavski00/rbk_api:v1
    environment:
      RBK_DB_URL: postgresql+psycopg://rbk_user:rbk_password_swarm@rbk_db:5432/rbk_db
    networks:
      - rbk_net_swarm
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.rbk.web == true
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # --- Nginx как точка входа ---
  rbk_nginx:
    image: nginx:1.27-alpine
    ports:
      - "8100:80"
    volumes:
      - ./rbk_nginx/rbk_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rbk_net_swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.rbk.web == true

volumes:
  rbk_pgdata_swarm:

networks:
  rbk_net_swarm:
    driver: overlay